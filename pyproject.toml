[project]
name = "kiba-build"
version = "0.1.10"
description = "Kiba Labs' python building and testing utilities"
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
    "asyncclick~=8.4.2",
    "bandit~=1.9.4",
    "bump-my-version~=1.8.1",
    "mypy~=2.4.1",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.4.1",
    "pytest-json-report~=1.5.0",
    "ruff~=0.17.3",
    "simple-chalk~=0.1.0",
    "twine~=7.0.0",
    "ty~=0.0.95",
    "wheel~=0.48.0",
]

[project.urls]
repository = "https://github.com/kibalabs/build-py"

[project.scripts]
lint-check = "buildpy.lint_check:run"
type-check = "buildpy.type_check:run"
security-check = "buildpy.security_check:run"
version = "buildpy.version:run"
publish-dev = "buildpy.publish_dev:run"
test-check = "buildpy.test_check:run"

[tool.uv]
package = true

[build-system]
requires = ["setuptools", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
core = ["/py.typed", "**/pyproject.toml"]
